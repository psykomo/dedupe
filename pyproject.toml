[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inmate-dedupe"
version = "0.1.0"
description = "Starter pipeline for inmate record deduplication with Splink + DuckDB"
requires-python = ">=3.10"
dependencies = [
  "duckdb>=0.10.0",
  "mysql-connector-python>=8.3.0",
  "pandas>=2.2.0",
  "pyarrow>=15.0.0",
  "pyyaml>=6.0.1",
  "splink>=3.9.0",
]

[project.scripts]
inmate-dedupe = "inmate_dedupe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
