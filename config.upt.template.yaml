source_mysql:
  host: "127.0.0.1"
  port: 3309
  user: "readonly_source_user"
  password: "source_pass"
  database: "sdp_pusat"
  # This becomes the logical state key in DuckDB for watermark/bootstrap state.
  source_table: "identitas___UPT__"
  custom_query: |
    SELECT
      it.*,
      p.ID_UPT AS ID_UPT
    FROM identitas it
    LEFT JOIN cif_mapping cm ON it.NOMOR_INDUK = cm.NOMOR_INDUK
    LEFT JOIN perkara p ON p.NOMOR_INDUK = it.NOMOR_INDUK
    WHERE cm.NOMOR_INDUK IS NULL
      AND p.ID_PERKARA IS NOT NULL
      AND p.ID_UPT IS NOT NULL
      AND it.NAMA_LENGKAP <> ''
      AND it.NAMA_LENGKAP NOT LIKE 'NAMA WBP%'
      AND it.NOMOR_INDUK NOT LIKE '11f066%'
      AND it.NOMOR_INDUK >= '__UPT__000000000000'
      AND it.NOMOR_INDUK <  '__UPT_NEXT__000000000000'
  source_id_column: "NOMOR_INDUK"
  source_updated_at_column: null

dedupe_duckdb:
  # Keep one shared DuckDB so cross-UPT linking still works.
  path: "./work/dedupe.duckdb"

