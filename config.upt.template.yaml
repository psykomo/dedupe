run:
  model_version: "v1-idn"
  batch_size: 100000
  work_dir: "./work"
  watermark_file: "./work/watermark___UPT__.json"
  bootstrap_state_file: "./work/bootstrap_state___UPT__.json"
  bootstrap_batch_rows: 200000
  review_candidate_limit: 250000
  max_training_pairs: 5000000

thresholds:
  auto_match_probability: 0.93
  review_match_probability: 0.82

blocking_rules:
  full:
    - "l.nik = r.nik"
    - "l.nomor_induk_nasional = r.nomor_induk_nasional"
    - "l.tanggal_lahir = r.tanggal_lahir and l.nama_prefix = r.nama_prefix"
    - "l.dob_year = r.dob_year and l.nama_lengkap_soundex = r.nama_lengkap_soundex and l.id_jenis_kelamin = r.id_jenis_kelamin"
    - "l.telepon_any = r.telepon_any and l.nama_prefix = r.nama_prefix"
  incremental:
    - "l.nik = r.nik"
    - "l.nomor_induk_nasional = r.nomor_induk_nasional"
    - "l.tanggal_lahir = r.tanggal_lahir and l.nama_prefix = r.nama_prefix"
    - "l.telepon_any = r.telepon_any and l.nama_prefix = r.nama_prefix"

deterministic_rules:
  - "l.nik = r.nik and l.nik IS NOT NULL"
  - "l.nomor_induk_nasional = r.nomor_induk_nasional and l.nomor_induk_nasional IS NOT NULL"
  - "l.nama_lengkap = r.nama_lengkap and l.tanggal_lahir = r.tanggal_lahir and l.id_jenis_kelamin = r.id_jenis_kelamin"
