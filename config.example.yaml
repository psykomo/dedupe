    - "id_jenis_pekerjaan"
    - "id_jenis_pekerjaan_lain"
    - "keterangan_pekerjaan"
    - "alamat_pekerjaan"
    - "minat"
    - "id_jenis_warganegara"
    - "id_negara_asing"
    - "id_jenis_status_perkawinan"
    - "tmp_tgl_ayah"
    - "tmp_tgl_ibu"
    - "nm_saudara"
    - "anakke"
    - "jml_saudara"
    - "jml_istri_suami"
    - "tmp_tgl_istri_suami"
    - "jml_anak"
    - "nm_anak"
    - "tinggi"
    - "berat"
    - "cacat"
