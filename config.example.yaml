    - "id_bentukrambut"
    - "id_jenis_muka"
    - "id_bentuk_mata"
    - "id_warna_mata"
    - "id_kacamata"
    - "id_jenis_hidung"
    - "id_telinga"
    - "id_jenis_mulut"
    - "id_bentukbibir"
    - "id_warnakulit"
    - "id_jenis_tangan"
    - "id_lengan"
    - "id_jenis_kaki"
    - "foto_depan"
    - "foto_kanan"
    - "foto_kiri"
    - "foto_closeup"
