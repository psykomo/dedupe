  nik: "nik"
  nomor_induk_nasional: "nomor_induk_nasional"
  nama_lengkap: "nama_lengkap"
  nama_alias1: "nama_alias1"
  nama_alias2: "nama_alias2"
  nama_alias3: "nama_alias3"
  nama_kecil1: "nama_kecil1"
  nama_kecil2: "nama_kecil2"
  nama_kecil3: "nama_kecil3"
  tanggal_lahir: "tanggal_lahir"
  id_jenis_kelamin: "id_jenis_kelamin"
  alamat: "alamat"
  alamat_alternatif: "alamat_alternatif"
