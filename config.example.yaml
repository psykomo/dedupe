source_mysql:
  host: "10.0.10.20"
  port: 3306
  user: "readonly_source_user"
  password: "replace-source-password"
  database: "corrections_prod"
  # Logical source name used for run/state metadata keys.
  source_table: "inmate_records_stage"
  # Optional: override table scan with a custom SELECT query.
  # Requirements:
  # - Query must expose all mapped columns in `columns.*`
  # - Query must expose `source_id_column`
  # - Query should expose `source_updated_at_column` when using updated_at cursor mode
  # - Do not include LIMIT; batching is controlled by pipeline options
  custom_query: null
  # custom_query: |
  #   SELECT it.*
  #   FROM identitas it
  #   LEFT JOIN cif_mapping cm ON it.NOMOR_INDUK = cm.NOMOR_INDUK
  #   LEFT JOIN perkara p ON p.NOMOR_INDUK = it.NOMOR_INDUK
  #   WHERE cm.NOMOR_INDUK IS NULL
  #     AND p.ID_PERKARA IS NOT NULL
  #     AND it.NAMA_LENGKAP <> ''
  #     AND it.NAMA_LENGKAP NOT LIKE 'NAMA WBP%'
  #     AND it.NOMOR_INDUK NOT LIKE '11f066%'
  #     AND p.ID_UPT IS NOT NULL
  source_id_column: "nomor_induk"
  # Optional. If null, incremental/bootstrap use source_id cursor mode (ordered by source_id_column).
  source_updated_at_column: "updated_at"

dedupe_duckdb:
  path: "./work/dedupe.duckdb"

